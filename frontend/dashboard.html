<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Content Pro</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <!-- Light/Dark Mode Button -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

    <div class="container">
        <h1>📝 Dashboard</h1>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="openTab('single')">Single Blog</button>
            <button class="tab-btn" onclick="openTab('batch')">Batch Upload (CSV)</button>
        </div>

        <div id="single" class="tab-content active">
            <textarea id="blogText" rows="8" placeholder="Paste your blog content here..."></textarea>
            <button onclick="generate()" id="genBtn">🚀 Generate & Analyze</button>
        </div>

        <div id="batch" class="tab-content">
            <p style="margin-bottom: 10px; color: #a0a0c0;">Upload a CSV file with a 'text' column.</p>
            <input type="file" id="csvFile" accept=".csv" style="background: transparent; border: none;">
            <button onclick="processBatch()" id="batchBtn">📊 Process Batch</button>
        </div>
    </div>

    <script>
        // --- Theme Toggle Logic ---
        if(localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); document.getElementById('themeBtn').innerText = '☀️'; }
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function generate() {
            const text = document.getElementById('blogText').value;
            if(!text) { alert("Please enter text!"); return; }
            const btn = document.getElementById('genBtn');
            btn.innerText = "⏳ Processing..."; btn.disabled = true;

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                localStorage.setItem('results', JSON.stringify(data));
                window.location.href = '/frontend/result.html'; 
            } catch (error) {
                alert("Error connecting to backend!");
                btn.innerText = "🚀 Generate & Analyze"; btn.disabled = false;
            }
        }

        async function processBatch() {
            const fileInput = document.getElementById('csvFile');
            if(fileInput.files.length === 0) { alert("Please upload a CSV file!"); return; }
            const btn = document.getElementById('batchBtn');
            btn.innerText = "⏳ Processing CSV..."; btn.disabled = true;

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const res = await fetch('/batch', { method: 'POST', body: formData });
                const data = await res.json();
                localStorage.setItem('batchResults', JSON.stringify(data));
                window.location.href = '/frontend/result.html'; 
            } catch (error) {
                alert("Error processing batch!");
                btn.innerText = "📊 Process Batch"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
